        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          community: ${{ steps.pre.outputs.COMUNIDADE }}
          namespace: ${{ steps.pre.outputs.TEAM }}
          name: BetterCombatText
          version: ${{ steps.pre.outputs.VERSAO_BetterCombatText }}
          description: ${{ steps.pre.outputs.DESC_BetterCombatText }}
          categories: mods
          repo: https://thunderstore.io
          path: envio-BetterCombatText
          file: dist/gumatos-BetterCombatText-${{ steps.pre.outputs.VERSAO_BetterCombatText }}.zip

      # 6. FECHA O CICLO. O resultado do job e decidido AQUI, nao no codigo de saida de cada
      #    envio: os passos 5.x tem `continue-on-error` para um mod com problema nao derrubar
      #    os outros. Este passo pergunta a API (endpoint por pacote, FRESCO) se CADA alvo
      #    ficou no ar; o que faltar vira erro nomeado.
      - name: "6. Confere o que ficou no ar (API por pacote, fresca)"
        env:
          ALVOS: ${{ needs.libera.outputs.alvos }}
          TEAM: ${{ needs.libera.outputs.team }}
          ENVIADOS: ${{ steps.pre.outputs.ENVIAR }}
          PULADOS: ${{ steps.pre.outputs.PULADOS }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          API_VERSAO = 'https://thunderstore.io/api/experimental/package/%s/%s/%s/'  # team, mod, versao
          API_PACOTE = 'https://thunderstore.io/api/experimental/package/%s/%s/'     # team, mod
          cabecalho = {'User-Agent': 'stolenRealmMods-publish (github.com/DefRuivo/stolenRealmMods)'}
          # 404 AQUI NAO E PROVA DE FALHA - e prova de que a plataforma ainda NAO INDEXOU.
          # O upload responde "Done!" quando ACEITA o pacote; o endpoint por pacote passa a
          # mostra-lo depois. No run 36784860531 o BetterStats (enviado 22:22:53Z) e o
          # RoguelikeSkillTreeVisualizer (22:23:23Z) foram lidos 404 durante todo o minuto de
          # polling e ESTAVAM no ar - o date_created dos dois e exatamente o instante do
          # envio. Nao e cache de CDN (os dois endpoints respondem `cf-cache-status: BYPASS`):
          # o atraso e da propria plataforma. Por isso:
          #   * a sondagem vai em RODADAS sobre o conjunto que falta, com intervalo crescente,
          #     em vez de gastar o tempo todo em um alvo (um pacote lento nao come a vez dos
          #     outros) - e um pacote que ja apareceu nao e sondado de novo;
          #   * DUAS fontes POR PACOTE (a versao exata e o `latest` do pacote), as duas
          #     frescas, em vez de so a versao exata;
          #   * teto de tempo para o run nao ficar pendurado; estourar o teto ainda e erro,
          #     mas o texto do erro diz que pode ser so indexacao atrasada.
          ORCAMENTO = 20 * 60        # s de sondagem no total (teto do run), nao por alvo
          ESPERA_INICIAL, ESPERA_MAX = 10, 60

          def erro(msg):
              print('::error::' + msg)
              sys.exit(1)

          alvos = json.loads(os.environ['ALVOS'])
          team = os.environ['TEAM'].strip()
          comunidade = os.environ.get('COMUNIDADE') or 'stolen-realm'
          enviados = json.loads(os.environ.get('ENVIADOS') or '[]')
          pulados = json.loads(os.environ.get('PULADOS') or '[]')
          # NADA de ler arquivo do repositorio aqui: os passos 5.x MOVEM o que recebem
          # para dentro do container, entao a area de trabalho do runner ja nao tem os
          # .csproj nem o release/mods.json. A versao de cada alvo vem do ambiente, que o
          # pre-flight escreveu para TODOS os alvos (inclusive os que ele pulou).

          def busca(url):
              # (status, corpo). 200 = existe; 404 = ainda nao aparece na API.
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=cabecalho),
                                              timeout=60) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as ex:
                  return ex.code, None
              except Exception:
                  return None, None

          def no_ar(nome, versao):
              # DUAS fontes, as duas POR PACOTE e frescas: a versao exata e o `latest` do
              # pacote (o `latest` cobre o caso de a versao exata estar em outro caminho de
              # leitura). Devolve (existe, o que a API respondeu agora).
              st, _ = busca(API_VERSAO % (team, nome, versao))
              if st == 200:
                  return True, 'HTTP 200'
              st_pac, corpo = busca(API_PACOTE % (team, nome))
              if st_pac == 200 and isinstance(corpo, dict):
                  if (corpo.get('latest') or {}).get('version_number') == versao:
                      return True, 'HTTP 200 (latest do pacote)'
              return False, 'HTTP %s (versao) / HTTP %s (pacote)' % (st, st_pac)

          vivos, faltando = [], []
          pendentes = []
          for nome in alvos:
              versao = os.environ.get('VERSAO_%s' % nome)
              if not versao:
                  erro('sem a versao de %s no ambiente - o pre-flight nao chegou a ler o '
                       '.csproj desse mod, entao nao da para conferir o envio.' % nome)
              pendentes.append((nome, versao))

          visto = {}
          inicio, espera, rodada = time.monotonic(), ESPERA_INICIAL, 0
          while pendentes:
              rodada += 1
              print('-- sondagem %d (%d alvo(s) ainda sem aparecer): %s'
                    % (rodada, len(pendentes), ', '.join(n for n, _ in pendentes)))
              for nome, versao in list(pendentes):
                  ok, o_que = no_ar(nome, versao)
                  visto[nome] = o_que
                  if ok:
                      vivos.append('%s v%s' % (nome, versao))
                      print('no ar  %-30s v%s  (%s)' % (nome, versao, o_que))
                      pendentes.remove((nome, versao))
              if not pendentes:
                  break
              if time.monotonic() - inicio >= ORCAMENTO:
                  print('::warning::teto de %d min de sondagem atingido - o que ainda nao '
                        'apareceu vai ser reportado como faltando.' % (ORCAMENTO // 60))
                  break
              time.sleep(espera)
              espera = min(int(espera * 1.5), ESPERA_MAX)

          for nome, versao in pendentes:
              faltando.append('%s v%s' % (nome, versao))
              print('::error::NAO esta no ar: %s v%s (%s)'
                    % (nome, versao, visto.get(nome, 'sem resposta')))

          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write('\n## Envio conferido na API publica\n\n')
                  fh.write('No ar: %s\n\n' % (', '.join(vivos) or '_nada_'))
                  fh.write('Enviados neste run: %s\n\n' % (', '.join(enviados) or '_nenhum_'))
                  fh.write('Pulados (ja publicados): %s\n\n' % (', '.join(pulados) or '_nenhum_'))
                  if faltando:
                      fh.write('**FALTANDO: %s**\n' % ', '.join(faltando))

          print()
          print('no ar: %d de %d alvo(s).' % (len(vivos), len(alvos)))
          print('Pagina da comunidade: https://thunderstore.io/c/%s/' % comunidade)
          print('Versoes vivem no repositorio, nunca em tag: o registro e o release/mods.json.')
          if faltando:
              erro('envio incompleto: %s nao aparece na API publica nem depois de sondar em '
                   'rodadas por ate %d min. ATENCAO: 404 aqui tambem acontece por ATRASO DE '
                   'INDEXACAO da plataforma (pacote aceito e no ar, so ainda invisivel na '
                   'API) - confira https://thunderstore.io/c/%s/ antes de concluir que '
                   'falhou. Reenviar NAO duplica: rode de novo com o input "todos", que o '
                   'pre-flight pula o que ja saiu e reenvia so o que falta. O que ja apareceu '
                   'neste run continua valido e ja foi registrado pelo job `registra`.'
                   % (', '.join(faltando), ORCAMENTO // 60, comunidade))
          PY

      - name: Falhou - o que fazer
        if: failure()
        run: |
          echo "::error::A publicacao parou. NADA foi enviado para a Thunderstore por este passo."
          echo "Cada passo acima diz o arquivo e a linha; o pre-flight recusa pacote velho,"
          echo "pacote incompleto e versao repetida (versao na Thunderstore e IMUTAVEL)."
          echo "O ciclo completo e o troubleshooting estao em docs/PUBLICACAO.md."
          echo "Nenhum token aparece no log - nem nos passos que falham."

  # ==========================================================================
  # 3) REGISTRO - le a API publica, confirma cada versao e grava em
  #    release/mods.json (aceite (d) da PUB-4: a versao publicada fica
  #    registrada no repositorio, e o registro e conferido, nao presumido).
  #    RODA TAMBEM QUANDO O JOB `publica` FALHOU: o que falha pode ser so a CONFERENCIA
  #    (o passo 6 existe justamente porque o codigo de saida dos envios nao decide o
  #    resultado) e, nesse caso, o que ENTROU NO AR precisa ficar registrado. Foi o que
  #    faltou no run 36784860531: os pacotes foram aceitos e ficaram no ar, o passo 6 leu
  #    404 por atraso de indexacao, e o registro das versoes ficou null ate alguem
  #    reconciliar a mao. Este job nao presume nada: grava APENAS o que o endpoint por
  #    pacote confirmar, commita o que confirmou e CONTINUA falhando (nomeando) o resto.
  #    SOBREVIVE A BRANCH TER ANDADO: o checkout deste job e o SHA da PUBLICACAO e a aprovacao
  #    humana pode levar minutos, entao o commit do registro e rebasado sobre a main fresca e o
  #    push repetido com espera crescente. Sem isso o run 36801937843 fechou VERMELHO com as seis
  #    versoes publicadas e o registro fora do repositorio (push recusado, nao fast-forward).
  # ==========================================================================
  registra:
    name: Registra a versao publicada em release/mods.json
    needs: [libera, publica]
    if: needs.libera.outputs.alvos != '[]' && (needs.publica.result == 'success' || needs.publica.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # so este job escreve, e so em release/mods.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # SEM `fetch-depth: 0`. Ele estava aqui com uma justificativa FALSA ("o fetch raso
        # padrao nao tem a base de merge para rebasar") e a linha e desnecessaria: o teste
        # com o estado EXATO deste job num clone raso (clone --depth 1 no SHA do run, commit
        # do registro por cima, main ganhando um commit na espera) faz `git fetch origin main`
        # + `git rebase origin/main` passarem e o push entrar. O motivo e a topologia: o
        # checkout deste job esta no SHA do RUN, que e ANCESTRAL da main que andou, entao o
        # fetch traz so os commits que faltam e a historia se conecta na fronteira shallow -
        # o merge base do rebase fica calculavel sem a historia inteira. O que conserta o run
        # 36801937843 (checkout cb0d12c, a main ganhou dois commits durante a espera) e o laco
        # de rebase + retry do passo "Commit e push do registro", nao a profundidade daqui.

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Confere na API publica e atualiza o registro
        id: atualiza
        env:
          ALVOS: ${{ needs.libera.outputs.alvos }}
          TEAM: ${{ needs.libera.outputs.team }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request

          def erro(msg):
              print('::error::' + msg)
              sys.exit(1)

          alvos = json.loads(os.environ['ALVOS'])
          team = os.environ['TEAM'].strip()

          with open('release/mods.json', encoding='utf-8') as fh:
              dados = json.load(fh)

          API_VERSAO = 'https://thunderstore.io/api/experimental/package/%s/%s/%s/'  # team, mod, versao
          url = 'https://thunderstore.io/c/%s/api/v1/package/' % dados['comunidade']
          cabecalho = {'User-Agent': 'stolenRealmMods-publish (github.com/DefRuivo/stolenRealmMods)'}

          def busca(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=cabecalho),
                                              timeout=60) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as ex:
                  return ex.code, None
              except Exception:
                  return None, None

          # Mesmo motivo do pre-flight: a lista da comunidade vem de cache de CDN (pode estar
          # velha por mais de uma hora). A versao recem-enviada e confirmada no endpoint por
          # pacote, que responde fresco; a lista fica como segunda fonte.
          st_lista, pacotes = busca(url)
          if not isinstance(pacotes, list):
              print('::warning::nao consegui ler a lista publica da comunidade (HTTP %s) - registro '
                    'so o que o endpoint por pacote confirmar.' % st_lista)
              pacotes = []
          publicados = {p.get('full_name'): (p.get('versions') or []) for p in pacotes}

          mudou, faltou = [], []
          for nome in alvos:
              with open('%s/%s.csproj' % (nome, nome), encoding='utf-8', errors='replace') as fh:
                  versao = re.search(r'<Version>([^<]+)</Version>', fh.read()).group(1).strip()
              st_viva, detalhe = busca(API_VERSAO % (team, nome, versao))
              viva = detalhe if (st_viva == 200 and isinstance(detalhe, dict)) else None
              if not viva:
                  for v in publicados.get('%s-%s' % (team, nome), []):
                      if v.get('version_number') == versao:
                          viva = v
              if not viva:
                  faltou.append('%s v%s' % (nome, versao))
                  continue
              entrada = [m for m in dados['mods'] if m.get('nome') == nome][0]
              if entrada.get('versao_publicada') == versao and entrada.get('publicado_em'):
                  print('ja registrado: %s v%s' % (nome, versao))
                  continue
              entrada['versao_publicada'] = versao
              entrada['publicado_em'] = viva.get('date_created') or ''
              mudou.append('%s v%s' % (nome, versao))
              print('registrado: %s v%s  (%s)' % (nome, versao, viva.get('date_created')))

          resumo = ['## Registro da publicacao', '',
                    'Alvos : %s' % ', '.join(alvos),
                    'Team  : %s' % team,
                    'Publicado e conferido na API: %s' % (', '.join(mudou) or '_nada novo_')]
          if faltou:
              resumo.append('NAO encontrado na API publica (nao registrado): %s' % ', '.join(faltou))
          resumo.append('')
          resumo.append('```json')
          resumo.append(json.dumps([m for m in dados['mods'] if m['nome'] in alvos], indent=2))
          resumo.append('```')
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write('\n'.join(resumo) + '\n')

          if mudou:
              with open('release/mods.json', 'w', encoding='utf-8', newline='\n') as fh:
                  json.dump(dados, fh, ensure_ascii=False, indent=2)
                  fh.write('\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('mudou=%s\n' % json.dumps(mudou))
              fh.write('faltou=%s\n' % json.dumps(faltou))
              fh.write('mensagem=%s\n' % ('registra ' + ', '.join(mudou) if mudou else 'sem mudanca'))

          if faltou:
              # O que RESPONDEU 200 ja foi gravado no arquivo e vai ser commitado pelo passo
              # seguinte (que roda com `always()`). Este erro e o sinal de que o registro
              # esta INCOMPLETO - nunca de que nada foi registrado.
              erro('registro incompleto: a API publica NAO mostra %s. O que apareceu ja foi '
                   'gravado e commitado; o que falta NAO foi inventado. Confira '
                   'https://thunderstore.io/c/%s/ e, se o pacote estiver no ar (a API tem '
                   'atraso de indexacao), rode de novo com o input "todos" para o registro '
                   'fechar.' % (', '.join(faltou), dados['comunidade']))
          if not mudou:
              print('::notice::nada a registrar (as versoes ja estavam registradas).')
          PY

      # O registro e um commit normal no repositorio. Se a branch main tiver protecao que
      # bloqueie push do GITHUB_TOKEN, este passo falha - e a publicacao CONTINUA valida:
      # o bloco do resumo acima e o que copiar a mao para release/mods.json.
      - name: Commit e push do registro
        # `always()`: o passo de conferencia pode ter terminado em erro DEPOIS de gravar o
        # que confirmou (registro parcial). O que ficou no ar tem que ser commitado de
        # qualquer jeito. O commit NAO depende do output `mudou` - a fonte da verdade e o
        # `git diff` abaixo (o output e escrito antes de um eventual erro, mas nao se conta
        # com isso).
        if: always()
        env:
          MENSAGEM: ${{ steps.atualiza.outputs.mensagem }}
        run: |
          : "${MENSAGEM:=registro de publicacao}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- release/mods.json; then
            echo "release/mods.json ja estava assim - nada a commitar."
            exit 0
          fi
          git add release/mods.json
          # [skip ci]: registrar versao nao precisa disparar a validacao de novo.
          git commit -m "release: ${MENSAGEM} na Thunderstore [skip ci]"

          # PUSH QUE SOBREVIVE A BRANCH TER ANDADO (run 36801937843, 01/10/2026).
          # Este job roda no SHA do run, e a aprovacao humana pode levar minutos: naquele run o
          # checkout era cb0d12c (01:29Z) e a main ganhou 46fde11 (01:50Z) e c26128d (01:51Z)
          # enquanto o run esperava no Environment. O `git push origin HEAD:main` unico foi
          # recusado por NAO ser fast-forward, o job fechou vermelho e as SEIS versoes que ja
          # estavam no ar ficaram fora do registro (reconciliado a mao depois). Conserto: rebasar
          # o commit do registro sobre a main FRESCA e repetir o push com espera crescente - a
          # espera cobre a branch andar de novo entre o nosso `fetch` e o nosso `push`.
          # O rebase nao conflita no caso normal: este commit so mexe em release/mods.json, e o
          # que a main ganhou durante a espera foi trabalho em outros arquivos.
          for tentativa in 1 2 3 4 5; do
            echo "::group::push do registro (tentativa ${tentativa})"
            git fetch --prune origin main
            # FALHA de rebase NAO e CONFLITO: o rebase tambem para por outro motivo
            # (identidade ausente no commit que ele refaz, autor invalido, indice sujo...) e
            # tratar os dois casos como "a main mexeu em release/mods.json" manda o
            # diagnostico para o lado errado. O sinal de CONFLITO sao os CAMINHOS NAO
            # MESCLADOS no indice (`git ls-files -u`); o diretorio `.git/rebase-merge` NAO
            # discrimina - medido: um rebase que para por identidade ausente deixa o
            # `.git/rebase-merge` e o `git ls-files -u` vazio.
            if ! saida_rebase=$(git rebase origin/main 2>&1); then
              conflito=nao
              if [ -n "$(git ls-files -u)" ]; then conflito=sim; fi
              git rebase --abort >/dev/null 2>&1 || true
              echo "$saida_rebase"
              echo "::endgroup::"
              if [ "$conflito" = "sim" ]; then
                echo "::error::o rebase do registro CONFLITOU: a main mexeu em release/mods.json entre"
                echo "o checkout do run e agora. A publicacao JA aconteceu (o passo anterior imprimiu o"
                echo "JSON para commitar a mao). Conflito NESTE arquivo exige decisao humana - ele e o"
                echo "registro, e as duas versoes podem estar certas em pontos diferentes."
              else
                echo "::error::o rebase do registro FALHOU e NAO foi conflito (nenhum caminho nao"
                echo "mesclado no indice): a causa e outra, e a saida do git esta logo acima. NAO era"
                echo "a main ter andado, entao repetir o push nao resolveria - conserte a causa."
                echo "A publicacao JA aconteceu; o JSON para commitar a mao esta no resumo do job."
              fi
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "::endgroup::"
              echo "registro commitado: $(git rev-parse --short HEAD) (tentativa ${tentativa})"
              exit 0
            fi
            echo "::endgroup::"
            # A ULTIMA tentativa nao espera: nao existe proxima, e o sleep dela era espera
            # MORTA - imprimia "Nova tentativa em 15s", dormia 15s e saia 1 logo em seguida
            # (45s dormidos para 4 tentativas de push de verdade).
            if [ "$tentativa" -lt 5 ]; then
              echo "::warning::push recusado na tentativa ${tentativa} - a main andou (ou o push nao e permitido; ver o fim deste passo). Nova tentativa em $((tentativa * 3))s."
              sleep $((tentativa * 3))
            else
              echo "::warning::push recusado na tentativa ${tentativa}, a ultima - nada a esperar."
            fi
          done

          echo "::error::o registro nao entrou na main depois de 5 tentativas. A publicacao JA aconteceu"
          echo "e o JSON do passo anterior esta no resumo deste job para commitar a mao. LEIA a mensagem"
          echo "do git push acima: se ela diz 'Permission ... denied' ou 'protected branch', NAO era"
          echo "corrida - e escrita do GITHUB_TOKEN (Settings - Actions - Workflow permissions) ou"
          echo "protecao da branch main, e o rebase/retry nao resolve isso."
          exit 1

      - name: Registro nao fechou - o que fazer
        if: failure()
        run: |
          echo "::error::O registro em release/mods.json NAO fechou (veja o erro do passo acima)."
          echo "O que a API confirmou ja foi gravado e, se o passo de commit rodou, ja esta na main."
          echo "Nada e inventado: o registro so recebe versao confirmada no endpoint por pacote, e e"
          echo "ele que faz os proximos releases recusarem versao repetida."
          echo "Se o pacote estiver no ar mas ainda fora do registro (a API tem atraso de indexacao),"
          echo "rode de novo com o input 'todos': o pre-flight pula o que ja saiu e o registro fecha."
