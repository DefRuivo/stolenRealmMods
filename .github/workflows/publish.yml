        if: contains(steps.pre.outputs.ENVIAR, '"BetterStats"')
        # Um mod com problema nao pode derrubar os outros cinco: quem decide o
        # resultado do job e o passo 6, que CONFERE na API o que ficou no ar.
        continue-on-error: true
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          community: ${{ steps.pre.outputs.COMUNIDADE }}
          namespace: ${{ steps.pre.outputs.TEAM }}
          name: BetterStats
          version: ${{ steps.pre.outputs.VERSAO_BetterStats }}
          description: ${{ steps.pre.outputs.DESC_BetterStats }}
          categories: mods
          repo: https://thunderstore.io
          path: envio-BetterStats
          file: dist/gumatos-BetterStats-${{ steps.pre.outputs.VERSAO_BetterStats }}.zip

