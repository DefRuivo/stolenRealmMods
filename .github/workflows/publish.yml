# PUB-4 + CI-3 - PUBLICACAO na Thunderstore, so dos mods LIBERADOS e com GATE HUMANO.
#
# O QUE ESTE WORKFLOW E
# ---------------------
# O caminho de uma VERSAO NOVA para a Thunderstore, com duas travas humanas: o arquivo
# `release/mods.json` (diz quais mods estao liberados) e um GitHub Environment com
# revisores obrigatorios (a aprovacao e no clique). Ele NAO compila nada: envia o .zip
# que `tools/pack-thunderstore.py` gerou na maquina de desenvolvimento.
#
# AS 5 DECISOES QUE ESTAO CODIFICADAS AQUI
# ----------------------------------------
# 1. PUBLICACAO MANUAL (workflow_dispatch) + aprovacao num Environment. Publicacao
#    automatica em push fica DESLIGADA (ver o bloco comentado mais abaixo, e por que).
# 2. O WORKFLOW NAO COMPILA. Os .csproj dependem das assemblies do JOGO, que ficam em
#    `lib/` (gitignored) e nao existem num runner limpo; commitar DLL do jogo e proibido.
#    O envio usa o input `file:` da Action pronta `GreenTF/upload-thunderstore-package`,
#    que PULA o build quando recebe um zip pronto. Quem builda e empacota e a maquina de
#    desenvolvimento (`dotnet build -c Release -p:DeployToBepInEx=false` + o empacotador).
# 3. QUEM ESTA LIBERADO: `release/mods.json` - versionado, revisavel no diff. O quadro de
#    tarefas do projeto nao esta no repositorio (gitignored de proposito), entao o CI nao
#    tem como consulta-lo; este arquivo e o unico jeito de o CI saber. Aqui ele age SO nos
#    mods com `publicar: true` - e falha de proposito se alguem pedir um mod travado.
# 4. "QUAL MOD MUDOU": no modo manual, quem manda e o input do disparo. No modo automatico
#    (comentado) seria o filtro nativo `paths:` por pasta de mod - nada de script adivinhando.
# 5. NUNCA PUBLICAR VERSAO REPETIDA: versao na Thunderstore e IMUTAVEL. Antes de enviar,
#    o passo 4 le a lista publica da comunidade (API /c/<comunidade>/api/v1/package/),
#    confere o manifesto DENTRO do zip contra o repositorio e recusa versao ja existente
#    ou que nao seja MAIOR que a que esta no ar (a plataforma exibe sempre a maior).
#    ATENCAO: essa lista e servida por CDN e JA VEIO STALE (mais de uma hora de atraso) -
#    por isso ela NAO decide sozinha: o passo 4 confirma a versao EXATA no endpoint por
#    pacote (API /api/experimental/package/<team>/<nome>/<versao>/), que responde fresco.
#    No disparo com o input `todos`, o mod que ja esta publicado NESTA versao e PULADO com
#    log claro ("ja publicado, pulando") em vez de derrubar o job - e o que permite
#    recuperar uma publicacao parcial em UM run. Em disparo de um mod especifico, versao
#    repetida CONTINUA sendo recusa.
#
# COMO O TOKEN ENTRA (CI-3)
# -------------------------
# `secrets.THUNDERSTORE_TOKEN` e secret do ENVIRONMENT `thunderstore`, nunca do repositorio:
# so o job `publica` (que declara o environment) enxerga o valor, e so depois da aprovacao.
# Nada aqui imprime o token - os passos so dizem que ele existe.
#
# COPIA LOCAL / DOCUMENTACAO
# --------------------------
# O processo completo (regras da Thunderstore, passo a passo, troubleshooting) esta em
# docs/PUBLICACAO.md; o resumo de CI esta em docs/CI.md. Reproduzir na mao: e usar o mesmo
# `tools/publish-thunderstore.sh` (dry-run por padrao, so sobe com --go).
#
# ESTE ARQUIVO ESTA PUBLICADO (nao ha mais bloqueio de PAT). Isso NAO se confere por MD5 do disco
# contra o MD5 do publicado: o disco pode estar sujo (edicao nao commitada) ou em CRLF, e uma
# reescrita de historico muda os SHAs - o MD5 muda sem nada ter mudado no que o GitHub roda.
# Confirme antes de assumir (a mesma regra esta em docs/CI.md, secao "Escopo B"):
#   git ls-remote origin main                 # SHA do main no GitHub
#   git rev-parse HEAD                        # SHA do commit de origem: iguais = o remoto tem este
#   git status --short -- .github/workflows/  # vazio = o disco tem o mesmo conteudo do commit
#   curl https://raw.githubusercontent.com/DefRuivo/stolenRealmMods/main/.github/workflows/publish.yml
# O envio local pelo `tools/publish-thunderstore.sh` (dry-run por padrao) continua valendo como
# caminho alternativo.

name: Publicacao Thunderstore

run-name: Publicar ${{ inputs.mod || 'todos' }} na Thunderstore (pedido de ${{ github.actor }})

on:
  # ---- disparo MANUAL (o unico ligado) -------------------------------------
  workflow_dispatch:
    inputs:
      mod:
        description: 'Mod a publicar. "todos" = so os mods com publicar:true em release/mods.json'
        type: choice
        required: true
        default: todos
        options:
          - todos
          - BetterCombatText
          - BetterFont
          - BetterStats
          - BetterTooltips
          - RoguelikeDebugger
          - RoguelikeSkillTreeVisualizer
      release_tag:
        description: 'Tag da GitHub Release de onde baixar os zips do dist/ (vazio = os zips tem que ja estar em dist/)'
        type: string
        required: false
        default: ''

  # ========================================================================
  # MODO AUTOMATICO - DESLIGADO DE PROPOSITO. Para ligar, descomente o bloco
  # `push:` abaixo (e a Action continua a mesma).
  # ========================================================================
  # "Qual mod mudou" no modo automatico e o filtro NATIVO `paths:` - um caminho por
  # pasta de mod. Sem script adivinhando: se nada foi empurrado naquela pasta, o run
  # nem comeca; se a pasta entrou no commit, o run comeca e o arquivo `release/mods.json`
  # continua decidindo se aquele mod PODE ser publicado (publicar:true).
  #
  # ATENCAO - o modo automatico NAO funciona com runner hospedado pelo GitHub: o job
  # precisa do .zip JA empacotado, e empacotar exige compilar, e compilar exige as
  # assemblies do jogo (`lib/`). Ligue isto SO junto com um runner SELF-HOSTED numa
  # maquina com o jogo instalado (escopo C da tarefa CI-1), que saiba rodar
  # `dotnet build -c Release -p:DeployToBepInEx=false` + `python tools/pack-thunderstore.py`
  # antes do envio - nesse caso troque `runs-on: ubuntu-latest` por `runs-on: self-hosted`
  # e mantenha o environment com revisores (a aprovacao continua sendo o portao final).
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - 'BetterCombatText/**'
  #     - 'BetterFont/**'
  #     - 'BetterStats/**'
  #     - 'BetterTooltips/**'
  #     - 'RoguelikeDebugger/**'
  #     - 'RoguelikeSkillTreeVisualizer/**'
  #     - 'release/mods.json'

# Uma publicacao NAO pode ser cancelada por outra: se deixar, o run novo mataria o antigo
# no meio do envio (e um envio parcial precisa de decisao humana, nao de retry silencioso).
concurrency:
  group: publicacao-thunderstore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1) GATE DOS MODS - le release/mods.json e monta a lista de alvos.
  #    Roda SEM environment: e so leitura, e o humano so deve aprovar o que ja
  #    passou por aqui.
  # ==========================================================================
  libera:
    name: Gate - quem esta liberado (release/mods.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      alvos: ${{ steps.gate.outputs.alvos }}
      team: ${{ steps.gate.outputs.team }}
    steps:
      # PINO DE ACTION E RUNTIME: `actions/checkout@v4` roda em Node 20, runtime que o GitHub
      # esta removendo - o run 36784860531 avisou que ele ja e FORCADO para Node 24. v5+ e
      # Node 24 (conferido no action.yml do repo da action). Mesma regra no `setup-python`:
      # v6 e a primeira major em Node 24 (v5 ainda e Node 20). Nao descer esses pinos sem
      # conferir `runs: using:` da action.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Gate dos mods liberados
        id: gate
        env:
          MOD: ${{ inputs.mod }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys

          def erro(msg):
              print('::error::' + msg)
              sys.exit(1)

          escolha = (os.environ.get('MOD') or 'todos').strip()

          with open('release/mods.json', encoding='utf-8') as fh:
              dados = json.load(fh)

          mods = dados.get('mods') or []
          if not mods:
              erro('release/mods.json esta sem a lista "mods".')

          # A lista do JSON tem que ser a MESMA que o empacotador descobre - senao existem
          # duas listas de mods e uma vai envelhecer. A descoberta de mod fica em UM lugar:
          # o `eh_mod` do tools/pack-thunderstore.py.
          p = subprocess.run([sys.executable, 'tools/pack-thunderstore.py', '--listar-nomes'],
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          saida = p.stdout.decode('utf-8', 'replace')
          if p.returncode != 0:
              erro('tools/pack-thunderstore.py --listar-nomes saiu %d: %s' % (p.returncode, saida.strip()))
          nomes_pack = [l.strip() for l in saida.splitlines() if l.strip()]
          nomes_json = [m.get('nome') for m in mods]
          if nomes_pack != nomes_json:
              erro('release/mods.json e o empacotador divergem - a lista de mods tem uma fonte so '
                   '(`tools/pack-thunderstore.py --listar-nomes`). JSON=%s | empacotador=%s'
                   % (nomes_json, nomes_pack))

          liberados = [m['nome'] for m in mods if m.get('publicar') is True]

          if escolha == 'todos':
              alvos = liberados
          else:
              alvo = [m for m in mods if m.get('nome') == escolha]
              if not alvo:
                  erro('mod desconhecido: %s (opcoes: todos, %s)' % (escolha, ', '.join(nomes_json)))
              if alvo[0].get('publicar') is not True:
                  erro('%s esta com publicar:false em release/mods.json e NAO sera publicado. '
                       'Motivo registrado: %s' % (escolha, alvo[0].get('motivo')))
              alvos = [escolha]

          team = (dados.get('team') or '').strip()
          if alvos and not team:
              erro('release/mods.json esta com "team" vazio (PUB-3: decidir qual team publica). '
                   'O team e escrito na URL do pacote e NAO se renomeia depois; publicar em outro '
                   'team cria um pacote NOVO. Enquanto isso o pipeline tem que falhar, nao chutar.')

          comun = (dados.get('comunidade') or '').strip()
          if alvos and not comun:
              erro('release/mods.json esta com "comunidade" vazia.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('alvos=%s\n' % json.dumps(alvos))
              fh.write('team=%s\n' % team)

          linhas = ['## Gate de publicacao (release/mods.json)', '',
                    'Pedido: `%s` | alvos: %s' % (escolha, ', '.join(alvos) or '_nenhum_'), '',
                    '| mod | liberado | versao publicada | motivo |', '|---|---|---|---|']
          for m in mods:
              linhas.append('| %s | %s | %s | %s |' % (
                  m.get('nome'), 'sim' if m.get('publicar') else 'NAO',
                  m.get('versao_publicada') or '-', m.get('motivo') or ''))
          # PKG-5: a ORDEM de envio mora em `ordem_de_envio` deste arquivo (o gate le este
          # arquivo, entao a ordem viaja junto da liberacao). A dependencia publica ANTES do
          # dependente - a Thunderstore recusa no upload a referencia a versao inedita.
          ordem = (dados.get('ordem_de_envio') or {}).get('ordem') or []
          if ordem:
              linhas += ['', '**Ordem de envio (dependencia ANTES do dependente):** '
                         + ' -> '.join(ordem)]
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write('\n'.join(linhas) + '\n')

          if not alvos:
              print('::notice::nenhum mod liberado para publicar (publicar:true) - nada sera enviado.')
              print('Nada a fazer. Para liberar um mod: vire "publicar" para true em release/mods.json')
              print('e explique em "motivo". A decisao humana fica visivel no diff do commit.')
              sys.exit(0)

          print('alvos: %s' % ', '.join(alvos))
          print('team : %s' % team)
          PY

  # ==========================================================================
  # 2) PUBLICACAO - aqui o gate humano e o Environment com revisores.
  # ==========================================================================
  publica:
    name: Publica na Thunderstore (Environment com revisores)
    needs: libera
    if: needs.libera.outputs.alvos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # O ENVIRONMENT E O GATE HUMANO. `thunderstore` precisa ter:
    #   * revisores obrigatorios (1+) - o job PARA aqui ate alguem aprovar, e a
    #     aprovacao e um clique em "Review deployments", nao uma variavel de ambiente;
    #   * o secret THUNDERSTORE_TOKEN (secret DO ENVIRONMENT, nao do repositorio);
    #   * (opcional) restricao de branch: only `main`.
    # Sem esse environment configurado, `secrets.THUNDERSTORE_TOKEN` chega vazio e o
    # passo 2 falha antes de qualquer envio - de proposito.
    environment: thunderstore
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: "0. Contexto (o gate humano ja passou)"
        run: |
          echo "quem disparou : $GITHUB_ACTOR"
          echo "commit        : $(git rev-parse --short HEAD)  $(git log -1 --pretty=%s)"
          echo "run           : $GITHUB_RUN_ID  (em $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          echo "alvos         : ${ALVOS_LEGIVEIS}"
          echo
          echo "Se o job ficou parado antes deste passo, era o gate humano: revise e aprove em"
          echo "'Review deployments'. Nada foi enviado antes da aprovacao."
        env:
          ALVOS_LEGIVEIS: ${{ needs.libera.outputs.alvos }}

      # 1. Nenhum token no que seria publicado. E o passo 0 do release-check, a mesma
      #    trava que o tools/publish-thunderstore.sh roda antes de enviar.
      - name: "1. Trava de segredo"
        run: python tools/check_segredos.py

      # 2. O token TEM que existir, e nunca aparece em log (so a noticia de que existe).
      - name: "2. Token do Environment"
        env:
          TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secrets.THUNDERSTORE_TOKEN vazio. O token e secret do ENVIRONMENT 'thunderstore' (Settings -> Environments), nao do repositorio. Crie o environment com revisores obrigatorios e adicione o secret - token de service account do TEAM escolhido (PUB-3)."
            exit 1
          fi
          echo "token presente (valor nunca vai para o log)."

      # 3. Os pacotes: zip PRONTO, gerado por `python tools/pack-thunderstore.py` na
      #    maquina de desenvolvimento. Nada aqui compila (ver o cabecalho).
      - name: "3a. Baixa os zips de uma GitHub Release (opcional)"
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'gumatos-*.zip' --dir dist --clobber
          ls -la dist

      - name: "3b. Quais pacotes estao no runner"
        run: |
          if [ -d dist ] && ls dist/gumatos-*.zip >/dev/null 2>&1; then
            ls -la dist/gumatos-*.zip
          else
            echo "dist/ nao tem nenhum gumatos-*.zip."
            echo "O passo 4 vai falhar e dizer o que rodar na sua maquina (o CI nao compila)."
          fi

      # 4. PRE-FLIGHT. Recusa envio incompleto: pacote ausente, zip de outro commit,
      #    versao repetida, versao menor que a que esta no ar, JSON mentindo sobre o
      #    que ja foi publicado. Sai com o que fazer, nao com "erro".
      - name: "4. Pre-flight (pacote, versao unica, lista publica)"
        id: pre
        env:
          ALVOS: ${{ needs.libera.outputs.alvos }}
          TEAM: ${{ needs.libera.outputs.team }}
          ESCOLHA: ${{ inputs.mod }}
        run: |
          python - <<'PY'
          import json, os, re, sys, time, urllib.error, urllib.request, zipfile

          AUTOR = 'gumatos'          # prefixo dos zips do tools/pack-thunderstore.py (AUTOR)
          API = 'https://thunderstore.io/c/%s/api/v1/package/'   # lista publica da comunidade
          # A lista da comunidade e servida por CDN: `cache-control: max-age=30`, e ja foi
          # servida STALE por mais de uma hora. Ela NAO serve para decidir "esta versao ja
          # saiu" - quem responde isso e o endpoint por pacote, que e fresco.
          API_DETALHE = 'https://thunderstore.io/api/experimental/package/%s/%s/'       # team, mod
          API_VERSAO  = 'https://thunderstore.io/api/experimental/package/%s/%s/%s/'    # team, mod, versao

          def erro(msg):
              print('::error::' + msg)
              sys.exit(1)

          alvos = json.loads(os.environ['ALVOS'])
          team = os.environ['TEAM'].strip()
          escolha = (os.environ.get('ESCOLHA') or 'todos').strip()

          cabecalho = {'User-Agent': 'stolenRealmMods-publish (github.com/DefRuivo/stolenRealmMods)'}

          def busca(url):
              # (status, corpo). 200 = existe; 404 = nao existe; (None, ex) = erro de verdade.
              # A API publica RATE-LIMITA cliente anonimo e oscila: medido aqui, ~25% das
              # chamadas rapidas voltaram 429 e houve erro de rede isolado
              # (`[SSL: UNEXPECTED_EOF_WHILE_READING]`). Sem repetir, um unico 429 numa
              # chamada ja derrubava o run inteiro com "nada e enviado" e um erro de rede
              # virava "nao consegui conferir a versao". 404 e RESPOSTA da API (nao se
              # repete); 429, 5xx e falha de rede se repetem, com espera - respeitando o
              # `Retry-After` quando a plataforma manda.
              ultimo, espera = None, 3
              for tentativa in range(4):
                  if tentativa:
                      time.sleep(espera)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=cabecalho),
                                                  timeout=60) as resp:
                          return resp.status, json.load(resp)
                  except urllib.error.HTTPError as ex:
                      if ex.code != 429 and ex.code < 500:
                          return ex.code, None
                      ultimo = ex
                      espera = min(int(ex.headers.get('Retry-After') or 0) or (3 * tentativa + 3), 30)
                  except Exception as ex:
                      ultimo = ex
                      espera = 3 * tentativa + 3
              return None, ultimo

          def no_ar(nome, versao):
              # "a versao X existe no ar?" com as TRES fontes e RE-PERGUNTANDO. A plataforma
              # e eventualmente consistente NAS DUAS DIRECOES: o pacote demora a APARECER
              # depois do envio (foi o que derrubou o run 36784860531 no passo 6) e tambem
              # devolve 404 esporadico para versao que esta no ar. Por isso a resposta
              # negativa so vale depois de esgotar as rodadas - e a positiva vale na hora.
              #   * lista da comunidade (CDN, pode vir velha): so serve para DIZER QUE EXISTE;
              #   * endpoint por pacote (`latest`) e endpoint da versao exata: frescos.
              for tentativa in range(4):
                  if tentativa:
                      time.sleep(3 * tentativa)
                  na_lista = [v.get('version_number') for v in publicados.get('%s-%s' % (team, nome), [])]
                  if versao in na_lista:
                      return True, 'lista da comunidade'
                  st_det, detalhe = busca(API_DETALHE % (team, nome))
                  if st_det == 200 and isinstance(detalhe, dict):
                      if (detalhe.get('latest') or {}).get('version_number') == versao:
                          return True, 'endpoint por pacote'
                  st_exata, _ = busca(API_VERSAO % (team, nome, versao))
                  if st_exata == 200:
                      return True, 'endpoint da versao'
              return False, 'nenhuma das tres fontes'

          with open('release/mods.json', encoding='utf-8') as fh:
              dados = json.load(fh)
          comunidade = dados['comunidade']

          # --- 4.1 o que JA esta publicado (fonte publica, sem token) ----------------
          # ATENCAO: a API publica responde 403 ao User-Agent padrao do urllib (o CDN
          # recusa cliente anonimo sem identificacao). Sem este cabecalho o pre-flight
          # aborta - e abortar esta certo: sem a lista nao da para garantir versao nova.
          url = API % comunidade
          st_lista, pacotes = busca(url)
          if st_lista != 200 or not isinstance(pacotes, list):
              erro('nao consegui ler a lista publica de versoes (%s): HTTP %s. Sem ela nao da para '
                   'garantir que a versao nao se repete, entao nada e enviado.'
                   % (url, st_lista if st_lista is not None else pacotes))
          publicados = {}
          for pac in pacotes:
              publicados[pac.get('full_name')] = pac.get('versions') or []

          enviar, pulados, versoes_alvo = [], [], {}
          linhas_env = []
          for nome in alvos:
              entradas = [m for m in dados['mods'] if m.get('nome') == nome]
              if not entradas:
                  erro('%s nao esta em release/mods.json. A lista de alvos VEM desse arquivo, '
                       'entao isto e um defeito do pipeline - nada e enviado.' % nome)
              entrada = entradas[0]

              # --- 4.2 a versao vem do <Version> do .csproj (fonte unica, PKG-2) -----
              with open('%s/%s.csproj' % (nome, nome), encoding='utf-8', errors='replace') as fh:
                  achado = re.search(r'<Version>([^<]+)</Version>', fh.read())
              if not achado:
                  erro('PKG-2: %s/%s.csproj sem <Version> (e o <Version> que manda).' % (nome, nome))
              versao = achado.group(1).strip()
              versoes_alvo[nome] = versao

              # --- 4.3 o pacote tem que existir e ser DESTE commit -------------------
              zip_rel = 'dist/%s-%s-%s.zip' % (AUTOR, nome, versao)
              if not os.path.isfile(zip_rel):
                  erro('PACOTE AUSENTE: %s nao existe no runner.\n'
                       '      Este workflow NAO COMPILA - os .csproj precisam das assemblies do JOGO\n'
                       '      (Assembly-CSharp.dll, UnityEngine, Sirenix) que ficam em lib/ (gitignored).\n'
                       '      Rode na maquina de desenvolvimento, da raiz do repo:\n'
                       '        dotnet build %s/%s.csproj -c Release -p:DeployToBepInEx=false\n'
                       '        python tools/pack-thunderstore.py %s\n'
                       '      e traga os zips do dist/ para o runner: anexe-os numa GitHub Release e\n'
                       '      dispare este workflow com o input release_tag apontando para ela.'
                       % (zip_rel, nome, nome, nome))

              with zipfile.ZipFile(zip_rel) as zf:
                  conteudo = zf.namelist()
                  manifesto = json.loads(zf.read('manifest.json').decode('utf-8'))

              obrigatorios = ['manifest.json', 'README.md', 'CHANGELOG.md', 'icon.png',
                              'plugins/%s/%s.dll' % (nome, nome)]
              faltando = [f for f in obrigatorios if f not in conteudo]
              if faltando:
                  erro('PACOTE INCOMPLETO (%s): falta %s. Pacote incompleto e pior que pacote '
                       'nenhum - refaca com tools/pack-thunderstore.py.' % (zip_rel, ', '.join(faltando)))
              if manifesto.get('name') != nome:
                  erro('O ZIP NAO E DESTE MOD: manifest.name=%s, esperado %s.'
                       % (manifesto.get('name'), nome))
              if manifesto.get('version_number') != versao:
                  erro('O ZIP ESTA VELHO: manifest.version_number=%s e o <Version> do .csproj e %s. '
                       'Rebuilde e reempacote antes de publicar.' % (manifesto.get('version_number'), versao))
              with open('%s/manifest.json' % nome, encoding='utf-8') as fh:
                  manifesto_repo = json.load(fh)
              for campo in ('name', 'version_number', 'description', 'dependencies'):
                  if manifesto_repo.get(campo) != manifesto.get(campo):
                      erro('O ZIP NAO E DESTE COMMIT: "%s" difere entre %s/manifest.json e o '
                           'manifesto dentro do %s.' % (campo, nome, zip_rel))

              # --- 4.4 versao IMUTAVEL: nunca repetir, sempre MAIOR ------------------
              # DUAS fontes, unidas (se QUALQUER uma disser que a versao existe, ela existe):
              # a lista da comunidade (cache de CDN, pode vir velha) e o endpoint por pacote
              # (fresco). Sem a segunda, um pacote publicado minutos antes passava batido aqui
              # e o envio morria com HTTP 400 "Package of the same namespace, name and version
              # already exists" - foi exatamente o que derrubou o run 36781938117: o BetterFont
              # v1.0.0 entrou no ar 3 min antes do passo 5.1 e a lista da comunidade ainda
              # estava velha, entao o pre-flight aprovou e o envio morreu no primeiro mod.
              full_name = '%s-%s' % (team, nome)
              publicada, onde = no_ar(nome, versao)

              if publicada:
                  if escolha == 'todos':
                      # Pedido de casa (`todos`): o que ja esta no ar e PULADO, nao derruba o
                      # job - e o que permite recuperar uma publicacao parcial em UM run.
                      print('ja publicado, pulando: %s v%s  (visto em: %s)' % (full_name, versao, onde))
                      # A versao vai para o ambiente mesmo no pulado: o passo 6 (e o
                      # resumo) confere TODOS os alvos, nao so os que este run enviou.
                      linhas_env.append('VERSAO_%s=%s' % (nome, versao))
                      pulados.append(nome)
                      continue
                  erro('VERSAO REPETIDA: %s v%s ja esta publicada e versao na Thunderstore e '
                       'IMUTAVEL (nem o README se edita depois). Suba o <Version> do .csproj, '
                       'sincronize os espelhos e empacote de novo.' % (full_name, versao))

              # --- 4.5 o JSON do repositorio nao pode mentir sobre o que ja saiu -----
              # A conferencia do REGISTRO usa a mesma busca das tres fontes (com repeticao):
              # antes ela olhava so a lista da comunidade + o `latest`, e um 429 ou um 404 de
              # leitura atrasada fazia o pre-flight acusar "registro errado no repositorio" e
              # abortar o run sem enviar nada - o registro estava certo, a API e que oscilou.
              reg = entrada.get('versao_publicada')
              if reg:
                  reg_no_ar, _ = no_ar(nome, reg)
                  if not reg_no_ar:
                      erro('release/mods.json diz que %s publicou v%s, e a API publica nao tem '
                           'essa versao (conferido nas tres fontes, com repeticao). Registro '
                           'errado no repositorio - conserte antes de publicar.' % (nome, reg))
              if not reg and publicada:
                  print('::warning::%s ja existe na Thunderstore (v%s) mas release/mods.json esta '
                        'com versao_publicada null - provavel publicacao fora do pipeline. '
                        'Atualize o registro.' % (full_name, versao))
              # NOTA: o antigo bloco "VERSAO NAO E MAIOR" saiu daqui. Ele ficava DEPOIS de um
              # `erro()` que encerra o processo, entao nunca rodou (codigo morto), e o que ele
              # queria dizer ja e coberto: qualquer versao que ja exista e recusada acima, e
              # versao nova e sempre maior que a que esta no ar para aquele pacote.

              linhas_env.append('VERSAO_%s=%s' % (nome, versao))
              enviar.append(nome)
              linhas_env.append('DESC_%s=%s' % (nome, manifesto['description']))
              print('ok    %-30s v%-8s -> %s' % (nome, versao, zip_rel))

          # Variaveis que os passos de envio consomem (a Action precisa de nome, versao,
          # descricao e comunidade; a descricao vem do manifesto DENTRO do zip, que e o
          # artefato que esta de fato indo para a plataforma).
          # Escritas nos DOIS lugares de proposito:
          #   * $GITHUB_OUTPUT -> lido como `steps.pre.outputs.<nome>` no `with:` das Actions
          #     (o contexto `steps` e o jeito documentado de levar valor dinamico para `with:`);
          #   * $GITHUB_ENV    -> lido como variavel de shell nos passos `run:`.
          linhas_env.append('ENVIAR=%s' % json.dumps(enviar))
          linhas_env.append('PULADOS=%s' % json.dumps(pulados))
          linhas_env.append('TEAM=%s' % team)
          linhas_env.append('COMUNIDADE=%s' % comunidade)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('\n'.join(linhas_env) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('\n'.join(linhas_env) + '\n')

          # ENVIAR e o que os passos 5.x consomem (o `if:` de cada um le este output); PULADOS
          # e o que o run nao precisa reenviar. O alvo pulado CONTINUA em `alvos` de proposito:
          # o job `registra` precisa dele para gravar a versao que ja esta no ar.
          resumo = ['## Pre-flight (o que vai ser enviado)', '',
                    '| mod | versao | acao |', '|---|---|---|']
          for nome in alvos:
              if nome in pulados:
                  acao = 'ja publicado - pulando'
              elif nome in enviar:
                  acao = 'envia'
              else:
                  acao = 'nao enviado'
              resumo.append('| %s | %s | %s |' % (nome, versoes_alvo.get(nome, '?'), acao))
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write('\n'.join(resumo) + '\n')

          print()
          if enviar:
              print('pre-flight ok: %d mod(s) para envio: %s' % (len(enviar), ', '.join(enviar)))
          else:
              print('::notice::nada a enviar - todos os alvos ja estao publicados nesta versao. '
                    'O job `registra` ainda confere e grava a versao em release/mods.json.')
          PY

      # ----------------------------------------------------------------------
      # 5. ENVIO - uma Action pronta por mod, com o input `file:` (zip pronto,
      #    build pulado). Sao passos separados porque a Action publica UM pacote
      #    por chamada; o `if` de cada um le a lista de alvos do job `libera`
      #    (um mod travado nunca chega aqui - ver o passo 1).
      #
      #    `repo:` e OBRIGATORIO: sem ele a Action monta `tcli publish --repository`
      #    vazio e o envio quebra (o valor "thunderstore.io" e o que o script da
      #    Action espera para apontar para a producao).
      #    `file:` e relativo a raiz do repo: a Action publica `dist/$file`, ou seja
      #    `dist/` + o valor daqui - por isso o valor comeca com `dist/` (nao e engano).
      #    `path:` e a entrada que faz o envio FUNCIONAR mais de uma vez no mesmo job:
      #    o entrypoint da Action faz `mv $TS_PATH/* /dist` e esse mv SAI da area de
      #    trabalho montada, entao com o padrao (".") o runner fica VAZIO depois da
      #    primeira invocacao e a segunda morre em `mv: cannot stat './*'` (foi o que
      #    derrubou o run 36781938117 no 5.2, DEPOIS do 5.1 publicar). Cada passo aponta
      #    para o seu proprio `envio-<Mod>/` (criado no passo 5.0), com a MESMA arvore que
      #    a Action espera: `dist/<zip>` + `README.md`, e so esse diretorio e consumido.
      #    `categories:` leva o SLUG MINUSCULO da categoria da comunidade, por mod (a Action
      #    mapeia para TS_CATEGORIES e o cfg_edit.js grava
      #    `publish.categories["stolen-realm"] = [...]` no thunderstore.toml do tcli; lista
      #    valida em /api/experimental/community/stolen-realm/category/):
      #      mods  -> BetterCombatText, BetterFont, BetterStats, BetterTooltips,
      #               RoguelikeSkillTreeVisualizer  (mudam o jogo para o jogador)
      #      tools -> RoguelikeDebugger                  (ferramenta de diagnostico)
      #    A CATEGORIA SO ENTRA NO ENVIO: versao publicada e imutavel e o token do CI e service
      #    account - a API recusa corrigir categoria depois (HTTP 403, "Service accounts are
      #    unable to perform this action"), entao categoria fora daqui = categoria nenhuma.
      # ----------------------------------------------------------------------
      # 5.0 O `path:` de cada 5.x aponta para um diretorio PROPRIO, porque a Action
      #     MOVE (`mv`) o que recebe para dentro do container: o que ela move some da
      #     area de trabalho do runner. Um diretorio por mod = cada envio tem o que a
      #     Action espera e os outros cinco ficam intactos. A arvore e a MESMA de antes
      #     (`dist/<zip>` + `README.md`, que a Action leva para /README.md).
      - name: "5.0 Prepara um diretorio de envio por mod (a Action move o que recebe)"
        run: |
          python - <<'PY'
          import json, os, shutil, sys

          with open('release/mods.json', encoding='utf-8') as fh:
              nomes = [m['nome'] for m in json.load(fh)['mods'] if m.get('publicar') is True]

          feitos, faltou = [], []
          for nome in nomes:
              versao = os.environ.get('VERSAO_%s' % nome)
              zip_rel = 'dist/gumatos-%s-%s.zip' % (nome, versao)
              if not versao or not os.path.isfile(zip_rel):
                  faltou.append(nome)
                  continue
              destino = 'envio-%s' % nome
              shutil.rmtree(destino, ignore_errors=True)
              os.makedirs(os.path.join(destino, 'dist'))
              shutil.copy2(zip_rel, os.path.join(destino, 'dist'))
              for extra in ('README.md', 'icon.png'):
                  if os.path.isfile(extra):
                      shutil.copy2(extra, destino)
              feitos.append(nome)
              print('envio-%-28s -> %s' % (nome, sorted(os.listdir(destino))))
          print('diretorios de envio prontos: %d de %d mod(s) liberado(s)'
                % (len(feitos), len(nomes)))
          if faltou:
              print('SEM PACOTE (nao teriam como ser enviados): %s' % ', '.join(faltou))
          PY

      - name: "5.1 Publica BetterFont"
        if: contains(steps.pre.outputs.ENVIAR, '"BetterFont"')
        # Um mod com problema nao pode derrubar os outros cinco: quem decide o
        # resultado do job e o passo 6, que CONFERE na API o que ficou no ar.
        continue-on-error: true
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          community: ${{ steps.pre.outputs.COMUNIDADE }}
          namespace: ${{ steps.pre.outputs.TEAM }}
          name: BetterFont
          version: ${{ steps.pre.outputs.VERSAO_BetterFont }}
          description: ${{ steps.pre.outputs.DESC_BetterFont }}
          categories: mods
          repo: https://thunderstore.io
          path: envio-BetterFont
          file: dist/gumatos-BetterFont-${{ steps.pre.outputs.VERSAO_BetterFont }}.zip

