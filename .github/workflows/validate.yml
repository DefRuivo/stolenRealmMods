# CI-2 (escopo A) - VALIDACAO dos checks do projeto.
#
# O QUE ESTE WORKFLOW E
# ---------------------
# Uma trava de REGRESSAO em push/PR para a main. Ele roda as ferramentas que ja existem
# em tools/ e reprova o commit quando qualquer uma reprova. Cada passo e um passo do
# ritual manual (segredos -> versoes -> patches -> build 0 erros -> check_fix_keys ->
# check_dupes -> instalar), so que verificado por maquina em vez de por memoria.
#
# O QUE ELE NAO E (de proposito)
# ------------------------------
#   * NAO COMPILA. Os .csproj dependem das assemblies do JOGO, que ficam em lib/ e sao
#     gitignored - num runner limpo elas nao existem. Commitar a DLL do jogo esta fora
#     de cogitacao (proibido distribuir). Compilar aqui exigiria a lib no CI, o que
#     significa hospedar arquivo de terceiro; nao vale o risco.
#   * NAO PUBLICA. Sem token, sem upload, sem release, sem `dist/`. Nenhum segredo e
#     lido e `permissions: contents: read` garante que nem se quisesse daria.
#   * NAO EMPACOTA ZIP NUM RUNNER LIMPO. `tools/pack-thunderstore.py` exige a DLL
#     buildada (`<Mod>/bin/Release/netstandard2.1/<Mod>.dll`) para montar o zip, e no
#     runner do GitHub nao ha DLL: `bin/` e gitignored e `lib/` (assemblies do JOGO)
#     tambem. Rodar o comando cru aqui sairia != 0 em TODO push e deixaria o job vermelho
#     para sempre. Por isso o passo 9 (empacotador) e GUARDADO: se achar DLL ele roda de
#     verdade e confere a estrutura do zip (4 arquivos na raiz + plugins/<Mod>/<Mod>.dll);
#     sem DLL ele valida so a descoberta de mods (`--listar-nomes`, a MESMA fonte de nomes
#     que o release/mods.json consome) e SEGUE. O metadado que o zip carrega
#     (manifest/icon/README/CHANGELOG) e conferido sem DLL pelo passo 8 em
#     `.github/scripts/valida_pacotes.py`; a DLL dentro de plugins/<Mod>/ e a
#     correspondencia artefato x fonte (REL-1) so o ritual LOCAL prova - o build nao entra
#     no CI.
#
# ORDEM DOS PASSOS: do mais barato/mais grave para o mais caro, e para no primeiro
# erro (o GitHub corta o job no primeiro `run` que sai != 0). Segredo primeiro: se
# entrou token no que seria publicado, nada mais importa. Versoes e patches logo em
# seguida, na MESMA ordem do ritual local (`tools/release-check.sh`): sao TRES passos
# que so leem o repositorio (nenhum precisa de build, de DLL ou do jogo) e nenhum dos
# tres faz sentido deixar para depois. O de patches vale mais que os outros dois de
# robustez: o parametro posicional do Harmony COMPILA sem um aviso sequer, entao nem o
# build nem o log de boot deste workflow o denunciariam.
#
# REPRODUZIR LOCALMENTE: os mesmos comandos, na mesma ordem, da raiz do repo.
# Ver docs/CI.md.

name: Validacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela o run antigo: nao faz sentido esperar validacao
# de um commit que ja foi superado.
concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  valida:
    name: Checks de validacao (nao compila, nao publica)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # PINO DE ACTION E RUNTIME: `actions/checkout@v4` roda em Node 20, runtime que o GitHub
      # esta removendo - o run 36784860531 avisou que ele ja e FORCADO para Node 24. v5+ e
      # Node 24 (conferido no action.yml do repo da action). Mesma regra no `setup-python`:
      # v6 e a primeira major em Node 24 (v5 ainda e Node 20). Nao descer esses pinos sem
      # conferir `runs: using:` da action.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Os scripts usam SÓ a biblioteca padrao (csv, json, re, struct, zlib, subprocess):
      # nao ha requirements. Uma instalacao de dependencia aqui seria superficie de risco
      # e tempo gastos a toa - se algum dia um script passar a importar pacote externo,
      # o passo 0 abaixo e onde isso aparece.
      - name: "0. Ambiente (sanidade)"
        run: |
          echo "python: $(python --version)"
          echo "git:    $(git --version)"
          echo "commit: $(git rev-parse --short HEAD)"
          echo "arquivos versionados: $(git ls-files | wc -l)"

      # 1. Nenhum token/credencial nos arquivos VERSIONADOS (e no que esta por commitar).
      #    E o passo 0 do release-check (o unico que ABORTA na hora la); roda sobre
      #    `git ls-files`, entao precisa do checkout com .git (o actions/checkout ja traz).
      - name: "1. Segredos (nenhum token no que seria publicado)"
        run: python tools/check_segredos.py

      # 2. A VERSAO de cada mod tem de bater nos TRES lugares (PKG-2): `<Version>` do
      #    .csproj (a fonte), `version_number` do manifest.json e o Plugin.cs
      #    (`[BepInPlugin(...)]` ou a const Version). E o passo 1 do release-check, na
      #    mesma posicao do ritual: so le o repositorio (sem build, sem DLL - o
      #    `pack-thunderstore.py` exige a DLL e por isso nao roda aqui). Versao
      #    divergente faz o log do BepInEx mentir sobre a build carregada e o pacote
      #    sair do ar com versao errada.
      #    Entra ANTES dos pacotes de proposito: `valida_pacotes.py` (passo 7) confere
      #    que o `version_number` e um semver valido, nao que ele e o MESMO do
      #    csproj/Plugin.cs - era esse furo que so o empacotador pegava, no fim.
      - name: "2. Versoes (csproj = manifest = Plugin.cs)"
        run: python tools/check_versoes.py

      # 3. TRV-1: as 5 regras de robustez dos patches Harmony (tools/check_patches.py), lidas
      #    dos .cs SEM compilar - e o passo 2 do release-check, na mesma posicao (le so o
      #    repositorio, sem build e sem DLL). Regras: nenhum parametro POSICIONAL do Harmony
      #    (`__0`/`__1`/`__2`/...), assinatura por TIPO em todo `[HarmonyPatch]` (typeof/nameof),
      #    todo Prefix/Postfix em try/catch (direto ou por delegacao), marcador de vida
      #    '... carregado.' em cada Plugin.cs e aplicacao gancho a gancho (nao `PatchAll()` puro).
      #    Nao precisa compilar - e justamente por isso que ele existe: um `ref __3` apontando
      #    para o argumento ERRADO passa pelo build sem uma linha de aviso e so aparece em jogo,
      #    como 112 NullReferenceException por frame (o caso que travou uma batalha do dono).
      #    Achado de slot posicional JUSTIFICADO em comentario sai como AVISO e NAO reprova;
      #    `PatchAll()` puro e patch sem try/catch tambem sao AVISO (dependem de refatoracao
      #    humana ja mapeada), entao o passo sai 0 hoje. Ver o cabecalho do proprio script.
      - name: "3. Patches (TRV-1: 5 regras de robustez do Harmony)"
        run: python tools/check_patches.py

      # 4. Chaves das tabelas do BetterTooltips contra o censo (RV-7). Hoje sai 0 com
      #    4 chaves "fora do censo" que sao texto de UI/loading - sao AVISO, nao erro
      #    (ver a secao "O que este censo AINDA nao cobre" em docs/cobertura/README.md).
      - name: "4. Chaves x censo (check_fix_keys)"
        run: python tools/check_fix_keys.py

      # 5. Chave DUPLICADA no LocalizePatch. E o modo de falha do INC-1: `Dictionary.Add`
      #    com chave repetida estoura ArgumentException e derruba o LocalizePatch
      #    INTEIRO na inicializacao estatica - o mod de textos simplesmente nao carrega.
      #    Vale mais que os outros: a falha e total e silenciosa no jogo.
      - name: "5. Chave duplicada (check_dupes - modo de falha do INC-1)"
        run: python tools/check_dupes.py

      # 6. Nota que repete o proprio texto (RV-15): o jogador le a mesma frase duas
      #    vezes. O script REGERA docs/cobertura/revisao/RV-15-notas-redundantes.md;
      #    no CI isso nao e commitado, so serve de trava (sai != 0 se achar caso).
      - name: "6. Notas redundantes (RV-15)"
        run: python tools/check_notas_redundantes.py

      # 7. Chave compartilhada (BUG-32): texto usado por mais de um dono no censo, onde
      #    uma correcao/nota por texto pode estar corrigindo o caso errado.
      #    `--estrito` LIGADO em 30/09/2026: a flag existe desde o mesmo dia e o unico caso
      #    real que a mantinha fora do CI (a nota de stack da `Consumption`, chave nas DUAS
      #    tabelas) foi corrigido - `python tools/check_chave_compartilhada.py --estrito;
      #    echo $?` sai 0 na arvore atual. Com a flag, a MESMA chave em `TextFixes` e em
      #    `TextAppends` reprova: o lookup e if/else if na mesma chave, entao a entrada de
      #    TextAppends nunca roda e a nota nao existe em jogo, sem erro no log.
      #    As SUSPEITAS (texto com nota usado por 2+ donos) continuam AVISO que nao reprova
      #    nem com a flag - ali a decisao e humana (ver "Armadilhas conhecidas" em docs/CI.md).
      - name: "7. Chave compartilhada (BUG-32)"
        run: python tools/check_chave_compartilhada.py --estrito

      # 8. Metadados dos pacotes Thunderstore: manifest.json (nome alfanumerico == pasta,
      #    semver, descricao <= 250, dependencies exatas), icon.png 256x256 e <= 1 MB,
      #    README.md e CHANGELOG.md. Uma pasta sem manifest.json (mod em implementacao)
      #    e apenas AVISADA - sem manifest ela nao e pacote, nao ha o que validar.
      - name: "8. Pacotes (manifest, icon, README, CHANGELOG)"
        run: python .github/scripts/valida_pacotes.py

      # 9. Empacotador Thunderstore, GUARDADO (ver a decisao no cabecalho). Com DLL -
      #    maquina de dev ou runner self-hosted - roda de verdade e confere a estrutura do
      #    zip (4 arquivos na raiz + plugins/<Mod>/<Mod>.dll). Sem DLL (o caso do runner
      #    do GitHub): valida so a descoberta de mods e SEGUE; o metadado ja foi checado
      #    no passo 8. NUNCA tire a guarda: o comando cru sai != 0 sem DLL e deixaria o
      #    job vermelho em todo push.
      - name: "9. Empacotador (tools/pack-thunderstore.py) - guardado sem DLL"
        run: |
          if ls */bin/Release/netstandard2.1/*.dll >/dev/null 2>&1; then
            echo "DLL encontrada neste runner: rodando o empacotador de verdade."
            python tools/pack-thunderstore.py
          else
            echo "sem */bin/Release/netstandard2.1/*.dll (lib/ do jogo e gitignored; bin/ nao existe num runner limpo)."
            echo "pack-thunderstore.py exige DLL buildada para zipar - empacotar continua sendo ritual LOCAL."
            echo "Validando o que da para validar sem build: a descoberta de mods (mesma fonte do release/mods.json)."
            python tools/pack-thunderstore.py --listar-nomes
          fi

      # 10. Auditoria das docs contra o disco (contagens, versoes, ferramentas citadas,
      #     links e caminhos). O script esta VERSIONADO em tools/audita_docs.py - foi
      #     promovido de scratch/ em 30/09/2026 -, entao este passo roda de verdade a
      #     cada push; a checagem de existencia abaixo so evita quebrar o job se o
      #     arquivo sair do repo um dia.
      - name: "10. Auditoria dos docs (tools/audita_docs.py)"
        run: |
          if [ -f tools/audita_docs.py ]; then
            python tools/audita_docs.py
          else
            echo "tools/audita_docs.py nao esta no repo - passo pulado de proposito."
            echo "Ele e versionado em tools/ hoje; se sumiu, foi remocao, nao 'vive em scratch/'."
          fi

      # Ajuda no caso de falha: resume onde olhar. `if: failure()` roda so quando algo
      # acima reprovou, e nao mascara o exit code do job.
      - name: Falhou - o que fazer
        if: failure()
        run: |
          echo "::error::Um dos checks de validacao reprovou. Veja o passo vermelho acima."
          echo "Cada script diz o arquivo e a linha do problema; a saida dele e o relatorio."
          echo "Para rodar os mesmos passos na sua maquina, veja docs/CI.md."
          echo
          echo "Lembrete: este workflow NAO compila e NAO publica - ele so le o repositorio."
          echo "Um check vermelho aqui e a mesma trava que o `tools/release-check.sh` faz"
          echo "antes de publicar, so que cedo, no push."
